openapi: 3.1.0
info:
  title: Keyboard Warrior Battle Royale API
  version: 1.0.0
  summary: 실시간 타이핑 배틀로얄 서비스용 REST API 및 WebSocket 이벤트 규약
  description: |
    이 문서는 `키보드 워리어 배틀로얄` 서비스의 HTTP API와 실시간 이벤트 계약을 정의합니다.

    주요 설계 원칙:
    - 익명 사용자도 첫 방문 즉시 플레이 가능
    - 대기 상태와 게임 진행 상태는 서버가 authoritative 하게 관리
    - 실시간 진행도 갱신은 WebSocket, 초기 화면 렌더링과 인증은 REST API 사용
servers:
  - url: http://localhost:3000
    description: local
  - url: https://webfull-9-10-hotsix.onrender.com
    description: render
tags:
  - name: Auth
    description: 익명 사용자 생성, 동일 기기 자동 로그인 복구, 토큰 재발급
  - name: Users
    description: 내 프로필 및 대시보드
  - name: Match
    description: 단일 게임 세션의 대기 상태, 입장, 진행 정보 조회
  - name: Health
    description: 헬스 체크
paths:
  /health:
    get:
      tags: [Health]
      summary: 서버 상태 조회
      operationId: getHealth
      responses:
        '200':
          description: 서버가 정상 동작 중입니다.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /v1/auth/guest/login:
    post:
      tags: [Auth]
      summary: 첫 방문 게스트 로그인
      description: |
        저장된 리프레시 토큰이 없는 기기에서 호출하는 첫 방문용 엔드포인트입니다.

        서버는 새로운 익명 사용자 프로필을 생성하고, 중복되지 않는 닉네임과 아바타 URL을 부여한 뒤
        짧은 수명의 액세스 토큰을 응답 바디로 반환합니다.

        리프레시 토큰은 `HttpOnly` 쿠키로 설정되며, 클라이언트 자바스크립트에서는 직접 접근할 수 없습니다.
        이후 동일 브라우저 환경에서 재접속 시 브라우저가 쿠키를 자동 전송하고,
        클라이언트는 `/v1/auth/refresh`로 자동 로그인 복구를 시도합니다.
      operationId: loginGuestOnFirstVisit
      responses:
        '201':
          description: 게스트 사용자 생성 및 세션 발급 성공
          headers:
            Set-Cookie:
              description: |
                `refreshToken` 을 담는 `HttpOnly`, `Secure`, `SameSite` 쿠키입니다.
                브라우저가 자동 저장하며 자바스크립트에서 읽을 수 없습니다.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSessionResponse'
        '409':
          description: 사용자 생성 또는 세션 발급 불가 상태
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/auth/refresh:
    post:
      tags: [Auth]
      summary: 동일 기기 자동 로그인 복구 및 토큰 재발급
      description: |
        브라우저가 자동 전송한 `HttpOnly` 리프레시 토큰 쿠키로 세션을 복구하는 엔드포인트입니다.

        사용 예시는 두 가지입니다.
        - 앱/브라우저 재실행 후 동일 기기 자동 로그인 복구
        - 액세스 토큰 만료 후 새 액세스 토큰 재발급

        서버는 쿠키에 담긴 리프레시 토큰을 검증한 뒤 새 액세스 토큰을 응답 바디로 반환하고,
        새 리프레시 토큰은 다시 `HttpOnly` 쿠키로 설정할 수 있습니다.
        기존 리프레시 토큰은 rotation 정책에 따라 더 이상 사용할 수 없게 처리할 수 있습니다.
      operationId: refreshAuthSession
      responses:
        '200':
          description: 자동 로그인 복구 또는 토큰 재발급 성공
          headers:
            Set-Cookie:
              description: |
                rotation 정책 적용 시 새 `refreshToken` 을 담아 갱신하는 `HttpOnly` 쿠키입니다.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSessionResponse'
        '401':
          description: 리프레시 토큰이 유효하지 않거나 만료 또는 폐기됨
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/auth/logout:
    post:
      tags: [Auth]
      summary: 현재 기기 로그아웃
      description: |
        현재 브라우저 환경에 저장된 `HttpOnly` 리프레시 토큰 쿠키를 무효화합니다.
        로그아웃 이후 동일 기기 자동 로그인은 동작하지 않으며, 다시 시작하려면 새 익명 로그인이 필요합니다.
      operationId: logoutAuthSession
      responses:
        '204':
          description: 로그아웃 성공
          headers:
            Set-Cookie:
              description: |
                만료된 `refreshToken` 쿠키를 내려 브라우저 저장 값을 삭제합니다.
              schema:
                type: string
        '401':
          description: 리프레시 토큰이 유효하지 않거나 이미 무효화됨
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/users/me:
    get:
      tags: [Users]
      summary: 내 프로필 조회
      operationId: getMyProfile
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 현재 인증된 사용자 프로필
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
        '401':
          description: 인증 필요
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    patch:
      tags: [Users]
      summary: 내 프로필 수정
      operationId: updateMyProfile
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserProfileRequest'
      responses:
        '200':
          description: 프로필 수정 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
        '400':
          description: 수정할 항목이 없음
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: 인증 필요
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      tags: [Users]
      summary: 내 계정 삭제
      operationId: deleteMyProfile
      security:
        - bearerAuth: []
      responses:
        '204':
          description: 계정 삭제 성공
        '401':
          description: 인증 필요
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: 존재하지 않는 유저
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/users/me/dashboard:
    get:
      tags: [Users]
      summary: 내 대시보드 통계 조회
      operationId: getMyDashboard
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 대시보드 통계
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDashboard'
        '401':
          description: 인증 필요
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/users/{userId}:
    get:
      tags: [Users]
      summary: 특정 유저 프로필 조회
      operationId: getUserById
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 유저 프로필
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
        '404':
          description: 존재하지 않는 유저
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/users/{userId}/dashboard:
    get:
      tags: [Users]
      summary: 특정 유저 대시보드 조회
      operationId: getUserDashboard
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 유저 대시보드
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDashboard'
        '404':
          description: 존재하지 않는 유저
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/lobby/join:
    post:
      tags: [Match]
      summary: 대기방 입장
      operationId: joinLobby
      security:
        - bearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JoinLobbyRequest'
      responses:
        '201':
          description: 대기방 입장 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JoinLobbyResponse'
        '401':
          description: 인증 필요
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: 존재하지 않는 유저
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/match/status:
    get:
      tags: [Match]
      summary: 현재 매칭 및 대기 상태 조회
      description: |
        사용자가 시작하기 버튼을 누르기 전이나 대기 화면 렌더링 시 필요한 매칭 스냅샷을 반환합니다.
        이 응답은 `지금 참가 가능한지`, `다음 시작까지 얼마나 남았는지` 같은 대기방 진입 판단에 초점을 둡니다.
      operationId: getCurrentMatchStatus
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 현재 매치 상태
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentMatchStatusResponse'
        '401':
          description: 인증 필요
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/match/join:
    post:
      tags: [Match]
      summary: 현재 라운드 참가 또는 관전 입장 처리
      description: |
        현재 게임 상태에 따라 참가자 또는 관전자 역할을 서버가 결정합니다.

        - `waiting` 상태: 기본적으로 참가자 등록
        - `in_progress` 상태: 관전자 등록
        - 이미 탈락한 사용자가 재요청한 경우: 관전자 등록
      operationId: joinCurrentMatch
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JoinMatchRequest'
      responses:
        '200':
          description: 입장 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JoinMatchResponse'
        '401':
          description: 인증 필요
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: 멀티 탭 접속 또는 중복 세션 감지
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/match:
    get:
      tags: [Match]
      summary: 현재 단일 게임 세션 상세 조회
      description: |
        실제 게임 화면 렌더링에 필요한 현재 단일 게임 세션의 상세 상태를 반환합니다.
        참가자 진행도, 제시 문장, 게임 메타데이터를 포함합니다.
      operationId: getCurrentGame
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 현재 게임 상세
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameDetailResponse'
        '404':
          description: 진행 예정 또는 진행 중인 게임이 없음
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/match/scoreboard:
    get:
      tags: [Match]
      summary: 현재 참가자 순위표 조회
      description: 진행 중인 게임의 참가자 순위, 진행률, 정확도 등 플레이 상태를 조회합니다.
      operationId: getCurrentScoreboard
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 참가자 목록과 실시간 순위
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScoreboardResponse'
  /v1/match/spectators:
    get:
      tags: [Match]
      summary: 현재 관전자 목록 조회
      description: 진행 중인 게임을 보고 있는 관전자 목록과 플레이어/탈락자 집계를 조회합니다.
      operationId: getCurrentSpectators
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 관전자 목록과 인원 집계
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SpectatorSnapshotResponse'
  /v1/match/result:
    get:
      tags: [Match]
      summary: 마지막 종료 게임 결과 조회
      description: 가장 최근에 종료된 라운드의 우승자와 최종 순위를 조회합니다.
      operationId: getLatestGameResult
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 가장 최근 종료된 게임 결과
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameResultResponse'
        '404':
          description: 아직 종료된 게임이 없음
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    HealthResponse:
      type: object
      required: [status, service]
      properties:
        status:
          type: string
          example: ok
        service:
          type: string
          example: keyboard-warrior-backend
    AuthTokens:
      type: object
      required:
        - tokenType
        - accessToken
        - expiresIn
        - accessTokenExpiresAt
      properties:
        tokenType:
          type: string
          example: Bearer
        accessToken:
          type: string
          example: eyJhbGciOi...
        expiresIn:
          type: integer
          description: 액세스 토큰 만료 시간(초)
          example: 3600
        accessTokenExpiresAt:
          type: string
          format: date-time
          example: '2026-04-29T12:00:00Z'
    UserProfile:
      type: object
      required: [id, nickname, avatarUrl, createdAt]
      properties:
        id:
          type: string
          format: uuid
          example: 3a4ea2b0-0f6f-4f04-a706-cde0eb13ef43
        nickname:
          type: string
          example: 폭주하는타자왕
        avatarUrl:
          type: string
          format: uri
          example: https://cdn.example.com/avatars/fox-1.png
        createdAt:
          type: string
          format: date-time
          example: '2026-04-27T10:00:00Z'
    AuthSessionResponse:
      type: object
      required: [user, tokens]
      description: |
        게스트 사용자 정보와 액세스 토큰을 함께 반환합니다.
        리프레시 토큰은 응답 바디에 포함되지 않으며, `HttpOnly` 쿠키로만 전달됩니다.
        동일 브라우저 환경 재접속 시 클라이언트는 `/v1/auth/refresh`를 호출해 자동 로그인 복구를 시도합니다.
      properties:
        user:
          $ref: '#/components/schemas/UserProfile'
        tokens:
          $ref: '#/components/schemas/AuthTokens'
    UserDashboard:
      type: object
      required:
        - userId
        - nickname
        - joinedAt
        - totalGames
        - wins
        - averageRank
        - recentRank
        - bestRank
      properties:
        userId:
          type: string
          format: uuid
        nickname:
          type: string
        joinedAt:
          type: string
          format: date-time
        totalGames:
          type: integer
          minimum: 0
          example: 42
        wins:
          type: integer
          minimum: 0
          example: 8
        averageRank:
          type: number
          format: float
          example: 3.4
        recentRank:
          type: integer
          minimum: 1
          example: 2
        bestRank:
          type: integer
          minimum: 1
          example: 1
        averageWpm:
          type: integer
          minimum: 0
          example: 312
        averageAccuracy:
          type: integer
          minimum: 0
          maximum: 100
          example: 97
    UpdateUserProfileRequest:
      type: object
      additionalProperties: false
      properties:
        nickname:
          type: string
          example: 새로운닉네임
        avatarUrl:
          type: string
          format: uri
          example: https://cdn.example.com/avatars/fox-1.png

    JoinLobbyRequest:
      type: object
      additionalProperties: false
      properties:
        nickname:
          type: string
          example: 폭주하는타자왕

    JoinLobbyResponse:
      type: object
      required: [userId, socketNamespace, socketAuthToken]
      properties:
        userId:
          type: string
          format: uuid
        socketNamespace:
          type: string
          example: /battle
        socketAuthToken:
          type: string
          example: ws_tk_2ef8b9d6c
    MatchPhase:
      type: string
      enum: [waiting, in_progress, finished]
      example: waiting
    ParticipantRole:
      type: string
      enum: [player, spectator]
      example: player
    ParticipantStatus:
      type: string
      enum: [waiting, alive, eliminated, finished, spectating, disconnected]
      example: alive
    MatchSummary:
      type: object
      description: 매칭 및 대기방 진입 판단에 필요한 현재 라운드 요약 정보
      required:
        - gameId
        - phase
        - minPlayers
        - waitingPlayerCount
        - playerCount
        - spectatorCount
        - eliminatedCount
        - startsAt
        - serverTime
      properties:
        gameId:
          type: integer
          example: 104
        phase:
          $ref: '#/components/schemas/MatchPhase'
        minPlayers:
          type: integer
          example: 4
        waitingPlayerCount:
          type: integer
          example: 6
        playerCount:
          type: integer
          example: 6
        spectatorCount:
          type: integer
          example: 3
        eliminatedCount:
          type: integer
          example: 1
        startsAt:
          type: string
          format: date-time
          nullable: true
        startedAt:
          type: string
          format: date-time
          nullable: true
        endsAt:
          type: string
          format: date-time
          nullable: true
        serverTime:
          type: string
          format: date-time
    WaitingRoomInfo:
      type: object
      required: [title, ruleSummary, countdownSeconds]
      properties:
        title:
          type: string
          example: 다음 라운드 대기실
        ruleSummary:
          type: array
          items:
            type: string
          example:
            - 오타가 나는 즉시 탈락합니다.
            - 가장 먼저 장문을 완성하면 우승합니다.
            - 생존자 1명만 남아도 즉시 종료됩니다.
        countdownSeconds:
          type: integer
          minimum: 0
          example: 18
    CurrentMatchStatusResponse:
      type: object
      description: |
        매칭 및 대기방 진입 화면용 응답입니다.
        실제 게임 중 참가자별 상세 진행률은 `/v1/match` 및 하위 엔드포인트에서 조회합니다.
      required: [match, waitingRoom, me]
      properties:
        match:
          $ref: '#/components/schemas/MatchSummary'
        waitingRoom:
          $ref: '#/components/schemas/WaitingRoomInfo'
        me:
          $ref: '#/components/schemas/MyMatchPresence'
    MyMatchPresence:
      type: object
      required: [userId, nickname, role, status, hasActiveSession]
      properties:
        userId:
          type: string
          format: uuid
        nickname:
          type: string
        role:
          $ref: '#/components/schemas/ParticipantRole'
        status:
          $ref: '#/components/schemas/ParticipantStatus'
        hasActiveSession:
          type: boolean
          example: true
    JoinMatchRequest:
      type: object
      additionalProperties: false
      required: [clientSessionId]
      properties:
        clientSessionId:
          type: string
          description: 브라우저 탭 단위 식별자. 멀티 탭 방지용
          example: tab_8u31v8b3
        preferredRole:
          type: string
          enum: [player, spectator]
          description: waiting 상태에서만 힌트로 사용됩니다.
          example: player
    JoinMatchResponse:
      type: object
      required: [gameId, assignedRole, assignedStatus, socketNamespace, socketAuthToken]
      properties:
        gameId:
          type: integer
          example: 104
        assignedRole:
          $ref: '#/components/schemas/ParticipantRole'
        assignedStatus:
          $ref: '#/components/schemas/ParticipantStatus'
        socketNamespace:
          type: string
          example: /battle
        socketAuthToken:
          type: string
          example: ws_tk_2ef8b9d6c
        reason:
          type: string
          nullable: true
          example: game_already_in_progress
    GameDetailResponse:
      type: object
      description: 게임 플레이 화면용 상세 응답
      required: [game, prompt, participants]
      properties:
        game:
          $ref: '#/components/schemas/GameSummary'
        prompt:
          $ref: '#/components/schemas/GamePrompt'
        participants:
          type: array
          items:
            $ref: '#/components/schemas/ParticipantSnapshot'
    GameSummary:
      type: object
      description: 진행 중인 게임 자체의 메타데이터
      required: [id, phase, minPlayers, totalPlayers, spectatorCount]
      properties:
        id:
          type: integer
          example: 104
        phase:
          $ref: '#/components/schemas/MatchPhase'
        minPlayers:
          type: integer
          example: 4
        totalPlayers:
          type: integer
          example: 6
        spectatorCount:
          type: integer
          example: 3
        winnerUserId:
          type: string
          format: uuid
          nullable: true
    GamePrompt:
      type: object
      required: [id, text, totalLength]
      properties:
        id:
          type: integer
          example: 7
        text:
          type: string
          example: 빠른 갈색 여우가 게으른 개를 뛰어넘는다.
        totalLength:
          type: integer
          example: 27
    ParticipantSnapshot:
      type: object
      required:
        - userId
        - nickname
        - avatarUrl
        - role
        - status
        - progressPercent
        - typedLength
        - rank
      properties:
        userId:
          type: string
          format: uuid
        nickname:
          type: string
        avatarUrl:
          type: string
          format: uri
        role:
          $ref: '#/components/schemas/ParticipantRole'
        status:
          $ref: '#/components/schemas/ParticipantStatus'
        progressPercent:
          type: integer
          minimum: 0
          maximum: 100
          example: 74
        typedLength:
          type: integer
          minimum: 0
          example: 20
        rank:
          type: integer
          minimum: 1
          example: 2
        wpm:
          type: integer
          minimum: 0
          example: 328
        accuracy:
          type: integer
          minimum: 0
          maximum: 100
          example: 98
    ScoreboardResponse:
      type: object
      description: 순위표 및 참가자 진행 상태 응답
      required: [gameId, phase, participants]
      properties:
        gameId:
          type: integer
          example: 104
        phase:
          $ref: '#/components/schemas/MatchPhase'
        participants:
          type: array
          items:
            $ref: '#/components/schemas/ParticipantSnapshot'
    SpectatorSnapshotResponse:
      type: object
      description: 관전 화면용 관전자 및 인원 집계 응답
      required: [gameId, spectatorCount, playerCount, eliminatedCount, spectators]
      properties:
        gameId:
          type: integer
          example: 104
        spectatorCount:
          type: integer
          example: 3
        playerCount:
          type: integer
          example: 6
        eliminatedCount:
          type: integer
          example: 1
        spectators:
          type: array
          items:
            $ref: '#/components/schemas/UserPreview'
    UserPreview:
      type: object
      required: [userId, nickname, avatarUrl]
      properties:
        userId:
          type: string
          format: uuid
        nickname:
          type: string
        avatarUrl:
          type: string
          format: uri
    GameResultResponse:
      type: object
      description: 종료된 게임의 최종 결과 응답
      required: [gameId, finishedAt, winner, rankings]
      properties:
        gameId:
          type: integer
          example: 104
        finishedAt:
          type: string
          format: date-time
        winner:
          $ref: '#/components/schemas/UserPreview'
        rankings:
          type: array
          items:
            $ref: '#/components/schemas/GameRanking'
    GameRanking:
      type: object
      required: [rank, userId, nickname, finalStatus]
      properties:
        rank:
          type: integer
          minimum: 1
          example: 1
        userId:
          type: string
          format: uuid
        nickname:
          type: string
        finalStatus:
          type: string
          enum: [winner, finished, eliminated, disconnected]
          example: winner
        typedLength:
          type: integer
          minimum: 0
          example: 27
        accuracy:
          type: integer
          minimum: 0
          maximum: 100
          example: 100
        wpm:
          type: integer
          minimum: 0
          example: 341
    ErrorResponse:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          example: INVALID_REFRESH_TOKEN
        message:
          type: string
          example: 리프레시 토큰이 유효하지 않습니다.
        details:
          type: object
          additionalProperties: true
x-websocket:
  namespace: /battle
  transport: socket.io
  authentication:
    description: REST `/v1/match/join` 응답의 `socketAuthToken`을 소켓 핸드셰이크 auth 값으로 전달합니다.
  events:
    clientToServer:
      - event: battle:join
        payload:
          type: object
          required: [gameId]
          properties:
            gameId:
              type: integer
              example: 104
        ack:
          type: object
          properties:
            ok:
              type: boolean
              example: true
      - event: battle:ready
        payload:
          type: object
          required: [gameId]
          properties:
            gameId:
              type: integer
              example: 104
      - event: battle:input
        description: 사용자가 새로 입력한 전체 문자열 또는 마지막 검증 지점까지의 문자열
        payload:
          type: object
          required: [gameId, typedText]
          properties:
            gameId:
              type: integer
              example: 104
            typedText:
              type: string
              example: 빠른 갈색 여우가
            cursorPosition:
              type: integer
              minimum: 0
              example: 8
      - event: battle:heartbeat
        payload:
          type: object
          required: [gameId, clientSessionId]
          properties:
            gameId:
              type: integer
            clientSessionId:
              type: string
              example: tab_8u31v8b3
    serverToClient:
      - event: battle:welcome
        payload:
          type: object
          properties:
            message:
              type: string
              example: Keyboard Warrior Battle Royale server connected
      - event: battle:state
        description: 현재 게임 전체 스냅샷
        payload:
          $ref: '#/components/schemas/GameDetailResponse'
      - event: battle:countdown
        payload:
          type: object
          required: [gameId, countdownSeconds]
          properties:
            gameId:
              type: integer
            countdownSeconds:
              type: integer
              example: 10
      - event: battle:progress
        payload:
          type: object
          required: [gameId, participant]
          properties:
            gameId:
              type: integer
            participant:
              $ref: '#/components/schemas/ParticipantSnapshot'
      - event: battle:eliminated
        payload:
          type: object
          required: [gameId, userId, reason]
          properties:
            gameId:
              type: integer
            userId:
              type: string
              format: uuid
            reason:
              type: string
              enum: [typo, inactivity, disconnected, multi_tab]
              example: typo
      - event: battle:finished
        payload:
          $ref: '#/components/schemas/GameResultResponse'
